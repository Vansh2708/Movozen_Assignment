No Android Studio, no problem — with 1 hour left, don't try to install it now (multi-GB download, too risky). Fastest real path: let GitHub Actions build the APK for you (GitHub's Ubuntu runners already have the Android SDK preinstalled), then sideload the APK onto your phone.

1
Get a GitHub account (skip if you have one)
If you don't have one already, make a free GitHub account (github.com) — fast if you already have an email handy. Skip if you have an account.
2
Create a new repo
On github.com, click New repository, name it dashcam-app, keep it Public (simpler, no extra config), create it empty (no README).
3
Upload the app code to the repo
Unzip DashcamApp.zip on your laptop. Inside the repo's local folder (after `git clone` the empty repo, or via GitHub's web upload), drag in everything from inside the DashcamApp folder (build.gradle, app/, settings.gradle, gradle.properties, gradle/ etc) so they sit at the repo root. Easiest if you don't know git: use GitHub's web UI → Add file → Upload files → drag the whole folder contents in → Commit.
4
Add a GitHub Actions workflow file
In the repo, Add file → Create new file → name it exactly `.github/workflows/build.yml` → paste the workflow below → Commit directly to main. This tells GitHub to build a debug APK on every push using its preinstalled Android SDK, no wrapper jar needed.
5
Watch the build run (2-5 min)
Go to the Actions tab in your repo. A run should already be in progress (triggered by your commit). It typically takes 2-5 minutes. Watch it go green.
6
Download the built APK
Once the run finishes, click into it, scroll to Artifacts at the bottom, and download `app-debug.zip` (contains the APK). Unzip it to get app-debug.apk.
7
Get the APK onto your phone and install it
Easiest: upload app-debug.apk to Google Drive/WhatsApp-to-self, open it on your phone, tap the file. Android will prompt to allow installs from this source — tap Settings → allow — then install. If you have a USB cable, you can also `adb install app-debug.apk` if adb happens to be on your laptop.
8
Run it and verify on the viewer page
Open the app, grant camera/mic permissions, type your roll number (uppercase, no spaces), tap Start Streaming, then check http://15.207.177.194:8081/web/player.html on a browser and press Unmute. Announce to organisers the moment it's live.
Here's the workflow file — paste this exactly into .github/workflows/build.yml:

yaml
name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk







